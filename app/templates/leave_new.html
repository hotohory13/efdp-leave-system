{% extends "base.html" %}
{% block title %}New Leave Request{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card card-efdp">
      <div class="card-body">
        <h5 class="card-title mb-3"><i class="fa-solid fa-plane-departure text-primary"></i> New Leave Request</h5>

        {% if user.role.value == "TeachingAssistant" %}
        <div class="alert alert-info small py-2">
          <i class="fa-solid fa-circle-info"></i> As a Teaching Assistant you must name a substitute colleague (BR-03).
        </div>
        {% endif %}

        <form method="post" action="/leave/new">
          <div class="mb-3">
            <label class="form-label">Leave type</label>
            <select name="leave_type_id" class="form-select" required>
              {% for lt in leave_types %}
                <option value="{{ lt.id }}">{{ lt.code }} — {{ lt.name_en }} (max {{ lt.max_consecutive_days }} consecutive days)</option>
              {% endfor %}
            </select>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Start date</label>
              <input type="date" name="start_date" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">End date</label>
              <input type="date" name="end_date" class="form-control" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Substitute colleague {% if user.role.value != "TeachingAssistant" %}<span class="text-muted small">(optional)</span>{% endif %}</label>
            <select name="substitute_id" class="form-select">
              <option value="">— none —</option>
              {% for e in colleagues %}
                <option value="{{ e.id }}">{{ e.full_name_en }} ({{ e.email }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Reason</label>
            <textarea name="reason" class="form-control" rows="3" required minlength="5"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Submit request</button>
          <a href="/" class="btn btn-link">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
